name: Sector Rebound - private beta review signing
on:
  workflow_dispatch:
    inputs:
      approved_source:
        description: Exact reviewed main commit SHA
        required: true
        type: string
      unsigned_sha256:
        description: Independently reviewed unsigned APK SHA256
        required: true
        type: string
      staging_run:
        description: Successful unsigned staging run ID for approved main source
        required: true
        type: string
      staging_artifact:
        description: Unsigned staging artifact ID from that run
        required: true
        type: string
      owner_approved:
        description: I approve this exact source and unsigned APK for private signing
        required: true
        type: boolean
        default: false
      recovery_confirmed:
        description: I verified independent original key recovery copies and secret scope
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  private-review:
    if: github.repository == 'EdenP-Development/Ricochet-Rumble' && github.ref == 'refs/heads/main' && inputs.owner_approved && inputs.recovery_confirmed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Refuse signed artifact creation in public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY" --jq '.private and .visibility == "private"' | grep -Fx true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify trusted staging evidence
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED: ${{ inputs.approved_source }}
          RUN_ID: ${{ inputs.staging_run }}
          ARTIFACT_ID: ${{ inputs.staging_artifact }}
          EXPECTED: ${{ inputs.unsigned_sha256 }}
        run: |
          set -euo pipefail
          [[ "$APPROVED" == "$GITHUB_SHA" && "$EXPECTED" =~ ^[0-9a-f]{64}$ && "$RUN_ID" =~ ^[0-9]+$ && "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          repo="repos/$GITHUB_REPOSITORY"
          gh api "$repo/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e --arg sha "$APPROVED" '.head_sha == $sha and .head_branch == "main" and .conclusion == "success" and .path == ".github/workflows/sr-hub-05-beta-staging.yml"' "$RUNNER_TEMP/run.json"
          gh api "$repo/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact.json"
          jq -e --arg id "$RUN_ID" '.expired == false and (.workflow_run.id|tostring) == $id and .name == "SR-HUB-05-UNSIGNED-STAGING-NOT-FOR-INSTALL"' "$RUNNER_TEMP/artifact.json"
          gh api "$repo/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/staging.zip"
          digest="$(jq -er '.digest' "$RUNNER_TEMP/artifact.json")"
          [[ "$digest" == sha256:* ]]
          echo "${digest#sha256:}  $RUNNER_TEMP/staging.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/staging.zip" Sector-Rebound-Beta1-UNSIGNED-STAGING.apk > "$RUNNER_TEMP/unsigned.apk"
          echo "$EXPECTED  $RUNNER_TEMP/unsigned.apk" | sha256sum -c -
          sdk="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          "$sdk" --install "build-tools;35.0.0"
      - name: Sign exact approved private review APK
        env:
          SR_OWNER_APPROVED: ${{ inputs.owner_approved }}
          SR_RECOVERY_CONFIRMED: ${{ inputs.recovery_confirmed }}
          SR_EXPECTED_UNSIGNED_SHA: ${{ inputs.unsigned_sha256 }}
          SR_PREVIOUS_VERSION_CODE: '0'
          SR_VERSION_CODE: '1'
          SR_VERSION_NAME: '0.9.80-beta.1'
          SECTOR_REBOUND_BETA_KEYSTORE_BASE64: ${{ secrets.SECTOR_REBOUND_BETA_KEYSTORE_BASE64 }}
          SECTOR_REBOUND_BETA_KEYSTORE_PASSWORD: ${{ secrets.SECTOR_REBOUND_BETA_KEYSTORE_PASSWORD }}
          SECTOR_REBOUND_BETA_KEY_ALIAS: ${{ secrets.SECTOR_REBOUND_BETA_KEY_ALIAS }}
          SECTOR_REBOUND_BETA_KEY_PASSWORD: ${{ secrets.SECTOR_REBOUND_BETA_KEY_PASSWORD }}
        run: bash tools/sign-sector-rebound-beta-review.sh "$RUNNER_TEMP/unsigned.apk" dist-private-review
      - uses: actions/upload-artifact@v4
        with:
          name: Sector-Rebound-PRIVATE-BETA-OWNER-REVIEW
          path: dist-private-review/
          if-no-files-found: error
          retention-days: 14
